<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4148"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="540" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <text x="28" y="36" font-size="22" font-weight="bold" fill="#1F2D3D">设计验证流程：逐级设阐</text>
  <text x="28" y="64" font-size="13" fill="#6B7280">每一级有独立判据；未通过不进入下一级，四类证据不能相互替代。</text>

  <!-- 第一行：01-04（左→右） -->
  <g>
    <rect x="30" y="96" width="225" height="90" rx="8" fill="#E9F1FB" stroke="#5B9BD5" stroke-width="1.3"/>
    <circle cx="30" cy="96" r="11" fill="#2F7FD1"/>
    <text x="30" y="100" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="146" y="132" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">Python 浮点模型</text>
    <text x="146" y="154" font-size="12" fill="#55606C" text-anchor="middle">48 kHz · 4 段</text>
    <text x="146" y="172" font-size="12" fill="#55606C" text-anchor="middle">193 抽头</text>

    <rect x="295" y="96" width="225" height="90" rx="8" fill="#E9F1FB" stroke="#5B9BD5" stroke-width="1.3"/>
    <circle cx="295" cy="96" r="11" fill="#2F7FD1"/>
    <text x="295" y="100" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="411" y="132" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">整数参考 / 定点核</text>
    <text x="411" y="154" font-size="12" fill="#55606C" text-anchor="middle">int16 / Q1.15</text>
    <text x="411" y="172" font-size="12" fill="#55606C" text-anchor="middle">逐位黄金输出</text>

    <rect x="560" y="96" width="225" height="90" rx="8" fill="#E9F5EC" stroke="#57A472" stroke-width="1.3"/>
    <circle cx="560" cy="96" r="11" fill="#2E9E63"/>
    <text x="560" y="100" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">03</text>
    <text x="676" y="132" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">HLS csim</text>
    <text x="676" y="154" font-size="12" fill="#55606C" text-anchor="middle">三条输出路径</text>
    <text x="676" y="172" font-size="12" fill="#55606C" text-anchor="middle">逐字节点级</text>

    <rect x="825" y="96" width="225" height="90" rx="8" fill="#E9F5EC" stroke="#57A472" stroke-width="1.3"/>
    <circle cx="825" cy="96" r="11" fill="#2E7D4F"/>
    <text x="825" y="100" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04</text>
    <text x="941" y="132" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">综合 / 布局布线</text>
    <text x="941" y="154" font-size="12" fill="#55606C" text-anchor="middle">36 拍 / 采样</text>
    <text x="941" y="172" font-size="12" fill="#55606C" text-anchor="middle">WNS +0.533 ns</text>
  </g>

  <!-- 行间连接（右向箭头圆点） -->
  <g fill="#E8873C">
    <circle cx="275" cy="141" r="10"/><circle cx="540" cy="141" r="10"/><circle cx="805" cy="141" r="10"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 272 136.5 L 278 141 L 272 145.5"/>
    <path d="M 537 136.5 L 543 141 L 537 145.5"/>
    <path d="M 802 136.5 L 808 141 L 802 145.5"/>
  </g>

  <!-- 04 → 05 竖向连接 -->
  <line x1="937" y1="188" x2="937" y2="266" stroke="#3A4148" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="937" cy="227" r="10" fill="#E8873C"/>
  <path d="M 932.5 224 L 937 230 L 941.5 224" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 第二行：05-08（右→左） -->
  <g>
    <rect x="825" y="278" width="225" height="90" rx="8" fill="#FBEEDF" stroke="#E8873C" stroke-width="1.3"/>
    <circle cx="825" cy="278" r="11" fill="#E8873C"/>
    <text x="825" y="282" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">05</text>
    <text x="941" y="314" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">板端 Overlay</text>
    <text x="941" y="336" font-size="12" fill="#55606C" text-anchor="middle">加载与直通/压缩</text>
    <text x="941" y="354" font-size="12" fill="#55606C" text-anchor="middle">自检 PASS</text>

    <rect x="560" y="278" width="225" height="90" rx="8" fill="#FBEEDF" stroke="#E8873C" stroke-width="1.3"/>
    <circle cx="560" cy="278" r="11" fill="#E8873C"/>
    <text x="560" y="282" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">06</text>
    <text x="676" y="314" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">频响 / WDRC / 延迟</text>
    <text x="676" y="336" font-size="12" fill="#55606C" text-anchor="middle">原始记录与报告图</text>
    <text x="676" y="354" font-size="12" fill="#55606C" text-anchor="middle">逐项对应</text>

    <rect x="295" y="278" width="225" height="90" rx="8" fill="#FBEEDF" stroke="#E8873C" stroke-width="1.3"/>
    <circle cx="295" cy="278" r="11" fill="#E8873C"/>
    <text x="295" y="282" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">07</text>
    <text x="411" y="314" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">鲁棒性 A–E</text>
    <text x="411" y="336" font-size="12" fill="#55606C" text-anchor="middle">边界 · 饱和 · 分块</text>
    <text x="411" y="354" font-size="12" fill="#55606C" text-anchor="middle">reset</text>

    <rect x="30" y="278" width="225" height="90" rx="8" fill="#FBEEDF" stroke="#E8873C" stroke-width="1.3"/>
    <circle cx="30" cy="278" r="11" fill="#E8873C"/>
    <text x="30" y="282" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">08</text>
    <text x="146" y="314" font-size="15.5" font-weight="bold" fill="#24313F" text-anchor="middle">600 秒长跑</text>
    <text x="146" y="336" font-size="12" fill="#55606C" text-anchor="middle">0 丢块</text>
    <text x="146" y="354" font-size="12" fill="#55606C" text-anchor="middle">板卡不挂</text>
  </g>

  <!-- 第二行连接（左向箭头圆点，流程 05→06→07→08） -->
  <g fill="#E8873C">
    <circle cx="805" cy="323" r="10"/><circle cx="540" cy="323" r="10"/><circle cx="275" cy="323" r="10"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 808 318.5 L 802 323 L 808 327.5"/>
    <path d="M 543 318.5 L 537 323 L 543 327.5"/>
    <path d="M 278 318.5 L 272 323 L 278 327.5"/>
  </g>

  <!-- 底部横幅 -->
  <rect x="30" y="416" width="1020" height="48" rx="8" fill="#FBEEDF"/>
  <text x="540" y="446" font-size="15" font-weight="bold" fill="#E8873C" text-anchor="middle">任一关失败：回到对应层修改，不把“数值正确”当作“实时达标”</text>

  <!-- 页脚依据 -->
  <text x="28" y="510" font-size="11.5" fill="#9AA3AD">依据：报告 §1.6、§2.5.3；rebuild.sh。流程为工程判据，不是工具自动串联。</text>
</svg>
