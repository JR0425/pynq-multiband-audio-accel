<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="1000" viewBox="0 0 1890 1000" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5560"/>
    </marker>
  </defs>
  <rect width="1890" height="1000" fill="#FFFFFF"/>

  <!-- 输入 -->
  <rect x="60" y="430" width="140" height="100" rx="8" fill="#F5F6F8" stroke="#9AA5B1" stroke-width="2"/>
  <text x="130" y="472" font-size="24" fill="#22364D" text-anchor="middle" font-weight="bold">输入 x[n]</text>
  <text x="130" y="504" font-size="20" fill="#5A6472" text-anchor="middle">48 kHz · Q1.15</text>

  <!-- 干线与四条支路 -->
  <line x1="200" y1="480" x2="240" y2="480" stroke="#4A5560" stroke-width="2.5"/>
  <polyline points="240,480 240,170 278,170" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <polyline points="240,480 240,410 278,410" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <polyline points="240,480 240,650 278,650" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <polyline points="240,480 240,890 278,890" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 三个低通 + 延迟 -->
  <rect x="280" y="120" width="200" height="100" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>
  <text x="380" y="160" font-size="23" fill="#22364D" text-anchor="middle" font-weight="bold">FIR 低通 500 Hz</text>
  <text x="380" y="192" font-size="20" fill="#445060" text-anchor="middle">193 抽头 · Q1.17 系数</text>

  <rect x="280" y="360" width="200" height="100" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>
  <text x="380" y="400" font-size="23" fill="#22364D" text-anchor="middle" font-weight="bold">FIR 低通 1 kHz</text>
  <text x="380" y="432" font-size="20" fill="#445060" text-anchor="middle">193 抽头 · Q1.17 系数</text>

  <rect x="280" y="600" width="200" height="100" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>
  <text x="380" y="640" font-size="23" fill="#22364D" text-anchor="middle" font-weight="bold">FIR 低通 2 kHz</text>
  <text x="380" y="672" font-size="20" fill="#445060" text-anchor="middle">193 抽头 · Q1.17 系数</text>

  <rect x="280" y="840" width="200" height="100" rx="8" fill="#FDF2E9" stroke="#D8A87A" stroke-width="2"/>
  <text x="380" y="880" font-size="23" fill="#4A331A" text-anchor="middle" font-weight="bold">延迟 96 采样</text>
  <text x="380" y="912" font-size="20" fill="#5A4A38" text-anchor="middle">群延迟 2.00 ms @ 48 kHz</text>

  <!-- 低通输出 → 汇合点 x=560 -->
  <line x1="480" y1="170" x2="618" y2="170" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <circle cx="560" cy="170" r="4" fill="#333A45"/>

  <line x1="480" y1="410" x2="560" y2="410" stroke="#4A5560" stroke-width="2.5"/>
  <circle cx="560" cy="410" r="4" fill="#333A45"/>
  <polyline points="560,410 560,316" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <polyline points="560,410 560,506" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <line x1="480" y1="650" x2="560" y2="650" stroke="#4A5560" stroke-width="2.5"/>
  <circle cx="560" cy="650" r="4" fill="#333A45"/>
  <polyline points="560,650 560,556" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <polyline points="560,650 560,749" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <polyline points="480,890 560,890 560,801" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- LP500 → S1 减输入 -->
  <polyline points="560,170 560,264" fill="none" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 减法器 S1 / S2 / S4 -->
  <circle cx="560" cy="290" r="22" fill="#FFFFFF" stroke="#333A45" stroke-width="2.5"/>
  <text x="533" y="262" font-size="22" fill="#445060">−</text>
  <text x="533" y="330" font-size="22" fill="#445060">+</text>

  <circle cx="560" cy="530" r="22" fill="#FFFFFF" stroke="#333A45" stroke-width="2.5"/>
  <text x="533" y="500" font-size="22" fill="#445060">+</text>
  <text x="533" y="572" font-size="22" fill="#445060">−</text>

  <circle cx="560" cy="775" r="22" fill="#FFFFFF" stroke="#333A45" stroke-width="2.5"/>
  <text x="533" y="745" font-size="22" fill="#445060">−</text>
  <text x="533" y="818" font-size="22" fill="#445060">+</text>

  <!-- 四段 → WDRC -->
  <line x1="582" y1="290" x2="618" y2="290" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="582" y1="530" x2="618" y2="530" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="582" y1="775" x2="618" y2="775" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <rect x="620" y="125" width="300" height="90" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>
  <rect x="620" y="245" width="300" height="90" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>
  <rect x="620" y="485" width="300" height="90" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>
  <rect x="620" y="730" width="300" height="90" rx="8" fill="#EAF1F8" stroke="#3B6BA5" stroke-width="2"/>


  <text x="770" y="160" font-size="21" fill="#22364D" text-anchor="middle" font-weight="bold">段1 · 包络检波 + WDRC</text>
  <text x="770" y="196" font-size="20" fill="#445060" text-anchor="middle">attack / release · 阈值 · 压缩比</text>
  <text x="770" y="280" font-size="21" fill="#22364D" text-anchor="middle" font-weight="bold">段2 · 包络检波 + WDRC</text>
  <text x="770" y="316" font-size="20" fill="#445060" text-anchor="middle">attack / release · 阈值 · 压缩比</text>
  <text x="770" y="520" font-size="21" fill="#22364D" text-anchor="middle" font-weight="bold">段3 · 包络检波 + WDRC</text>
  <text x="770" y="556" font-size="20" fill="#445060" text-anchor="middle">attack / release · 阈值 · 压缩比</text>
  <text x="770" y="765" font-size="21" fill="#22364D" text-anchor="middle" font-weight="bold">段4 · 包络检波 + WDRC</text>
  <text x="770" y="801" font-size="20" fill="#445060" text-anchor="middle">attack / release · 阈值 · 压缩比</text>

  <!-- WDRC → 段增益 → 求和总线 -->
  <line x1="920" y1="170" x2="972" y2="170" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="920" y1="290" x2="972" y2="290" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="920" y1="530" x2="972" y2="530" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="920" y1="775" x2="972" y2="775" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <circle cx="1000" cy="170" r="26" fill="#FDF2E9" stroke="#D8A87A" stroke-width="2"/>
  <text x="1000" y="178" font-size="21" fill="#4A331A" text-anchor="middle" font-weight="bold">×g1</text>
  <circle cx="1000" cy="290" r="26" fill="#FDF2E9" stroke="#D8A87A" stroke-width="2"/>
  <text x="1000" y="298" font-size="21" fill="#4A331A" text-anchor="middle" font-weight="bold">×g2</text>
  <circle cx="1000" cy="530" r="26" fill="#FDF2E9" stroke="#D8A87A" stroke-width="2"/>
  <text x="1000" y="538" font-size="21" fill="#4A331A" text-anchor="middle" font-weight="bold">×g3</text>
  <circle cx="1000" cy="775" r="26" fill="#FDF2E9" stroke="#D8A87A" stroke-width="2"/>
  <text x="1000" y="783" font-size="21" fill="#4A331A" text-anchor="middle" font-weight="bold">×g4</text>

  <line x1="1026" y1="170" x2="1252" y2="170" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="1026" y1="290" x2="1252" y2="290" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="1026" y1="530" x2="1252" y2="530" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="1026" y1="775" x2="1252" y2="775" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 求和总线 -->
  <line x1="1260" y1="170" x2="1260" y2="775" stroke="#333A45" stroke-width="3"/>
  <circle cx="1260" cy="170" r="4" fill="#333A45"/>
  <circle cx="1260" cy="290" r="4" fill="#333A45"/>
  <circle cx="1260" cy="530" r="4" fill="#333A45"/>
  <circle cx="1260" cy="775" r="4" fill="#333A45"/>
  <text x="1240" y="440" font-size="24" fill="#333A45" text-anchor="end" font-weight="bold">四段求和 Σ</text>

  <!-- 输出 -->
  <line x1="1260" y1="472" x2="1396" y2="472" stroke="#4A5560" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="1400" y="422" width="220" height="100" rx="8" fill="#F5F6F8" stroke="#9AA5B1" stroke-width="2"/>
  <text x="1510" y="464" font-size="24" fill="#22364D" text-anchor="middle" font-weight="bold">输出 y[n]</text>
  <text x="1510" y="496" font-size="20" fill="#5A6472" text-anchor="middle">输出级带饱和不绕回</text>

  <!-- 底注 -->
  <text x="945" y="965" font-size="22" fill="#8C9BAB" text-anchor="middle">阈值、压缩比、起振/释放时间、四段增益均为运行期寄存器，经网页验配界面实时可改　·　四段相加重建全带信号，相减式分频保证无相位失配缝隙</text>
</svg>
